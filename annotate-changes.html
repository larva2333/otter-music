<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        background: #fff;
        font-family: system-ui, "Microsoft YaHei", sans-serif;
        padding: 20px;
      }
      .wrap {
        position: relative;
        width: 600px;
        display: inline-block;
        vertical-align: top;
        margin-right: 28px;
      }
      img {
        width: 600px;
        display: block;
        border: 1px solid #ddd;
        border-radius: 10px;
      }
      .circle {
        position: absolute;
        border: 4px solid #e5342a;
        border-radius: 50%;
        pointer-events: none;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.9);
      }
      .tag {
        position: absolute;
        background: #e5342a;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 6px;
        white-space: nowrap;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      }
      .legend {
        display: inline-block;
        vertical-align: top;
        width: 430px;
        font-size: 16px;
        line-height: 1.65;
      }
      .legend h1 {
        font-size: 26px;
        margin: 0 0 18px;
      }
      .legend .item {
        margin: 0 0 14px;
        padding: 11px 13px;
        background: #fff6f5;
        border-left: 4px solid #e5342a;
        border-radius: 0 8px 8px 0;
      }
      .legend .item b {
        display: block;
        font-size: 17px;
        margin-bottom: 3px;
      }
      .no {
        display: inline-block;
        background: #e5342a;
        color: #fff;
        width: 23px;
        height: 23px;
        line-height: 23px;
        text-align: center;
        border-radius: 50%;
        font-weight: 700;
        margin-right: 6px;
      }
    </style>
  </head>
